name: Quality

"on":
  pull_request:
    branches:
      - main
      - develop
      - "release-*"
  push:
    branches:
      - main
      - develop
      - "release-*"
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Deploy the Firebase backend to staging after validation
        type: boolean
        default: false
      distribute_ios:
        description: Deploy staging and distribute the iOS build after validation
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

# Cancel obsolete PR runs, but never interrupt a deployment on push or dispatch.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # NOUVEAU : détecte quels dossiers ont changé pour éviter de lancer le job
  # iOS (macOS, 10x) quand seul le backend a bougé, et inversement.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      shared: ${{ steps.filter.outputs.shared }}
      web_exists: ${{ steps.web_present.outputs.value }}
      duplicate_ios_push: ${{ steps.duplicate.outputs.value }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ios:
              - 'ios-assodarts/**'
              - 'codemagic.yaml'
            backend:
              - 'backend/**'
            web:
              - 'web/**'
            shared:
              - 'shared/**'

      - name: Check whether web is present
        id: web_present
        run: |
          if test -f web/package.json; then echo 'value=true' >> "$GITHUB_OUTPUT"; else echo 'value=false' >> "$GITHUB_OUTPUT"; fi

      # An existing PR checks the same SHA; avoid paying for a second macOS job.
      # If GitHub cannot be queried, run the job rather than silently skipping it.
      - name: Detect duplicate iOS push checks
        id: duplicate
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if prs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f "head=$GITHUB_REPOSITORY_OWNER:$GITHUB_REF_NAME" -f per_page=100); then
            if echo "$prs" | jq -e --arg sha "$GITHUB_SHA" 'any(.[]; .head.sha == $sha and (.base.ref == "main" or .base.ref == "develop" or (.base.ref | startswith("release-"))))' > /dev/null; then
              echo 'value=true' >> "$GITHUB_OUTPUT"
            else
              echo 'value=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'Could not check for a duplicate PR; running the iOS job.'
            echo 'value=false' >> "$GITHUB_OUTPUT"
          fi

  ios:
    name: iOS build, test, lint, and SAST
    needs: changes
    # Always run on explicit dispatch; PRs cover duplicate develop push checks.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (needs.changes.outputs.ios == 'true' && needs.changes.outputs.duplicate_ios_push != 'true')
    runs-on: macos-15
    # 30 min ne suffisaient pas : la résolution SPM à froid coûte ~17 min à elle
    # seule, avant même la compilation instrumentée par CodeQL.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: swift
          build-mode: manual

      - name: Restore Swift package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Xcode place sinon les checkouts dans DerivedData/Assodarts-<hash>/,
          # dont le suffixe varie : le cache ne retrouvait jamais rien. Les deux
          # commandes xcodebuild ci-dessous épinglent ce même chemin.
          path: .spm-checkouts
          key: ${{ runner.os }}-spm-${{ hashFiles('ios-assodarts/Assodarts.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install SwiftLint
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 \
            --output "$RUNNER_TEMP/portable_swiftlint.zip" \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  $RUNNER_TEMP/portable_swiftlint.zip" | shasum --algorithm 256 --check
          unzip -q "$RUNNER_TEMP/portable_swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Show SwiftLint version
        run: swiftlint version

      - name: Lint Swift source
        run: swiftlint lint --lenient --config .swiftlint.yml

      - name: Resolve Swift package dependencies
        run: >-
          xcodebuild -resolvePackageDependencies
          -project ios-assodarts/Assodarts.xcodeproj
          -scheme Assodarts
          -clonedSourcePackagesDirPath .spm-checkouts

      - name: Build and test
        run: >-
          xcodebuild test
          -project ios-assodarts/Assodarts.xcodeproj
          -scheme Assodarts
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          -clonedSourcePackagesDirPath .spm-checkouts
          -enableCodeCoverage YES
          -resultBundlePath TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO

      - name: Export code coverage for SonarQube
        run: python3 .github/scripts/xccov_to_sonar_generic.py TestResults.xcresult ios-coverage.xml "$GITHUB_WORKSPACE"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-coverage
          path: ios-coverage.xml
          retention-days: 1

      - name: Upload CodeQL results
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:swift
          upload: never
          output: ${{ github.workspace }}/codeql-results/ios
          post-processed-sarif-path: ${{ github.workspace }}/codeql-results/ios-final

      - name: Summarize iOS CodeQL results
        if: >-
          always() &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          python3 .github/scripts/summarize_codeql_sarif.py \
            "${{ github.workspace }}/codeql-results/ios-final" \
            "iOS"

      - name: Upload iOS CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-ios
          path: ${{ github.workspace }}/codeql-results/ios.sarif
          retention-days: 30

  backend:
    name: Cloud Functions quality and SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Install Cloud Functions dependencies
        working-directory: backend/functions
        run: npm ci --ignore-scripts --loglevel=error

      - name: Audit dependencies
        working-directory: backend/functions
        run: npm audit --audit-level=high

      - name: Check formatting
        working-directory: backend/functions
        run: npm run format

      - name: Lint Cloud Functions
        working-directory: backend/functions
        run: npm run lint

      - name: Type-check and build
        working-directory: backend/functions
        run: npm run build

      - name: Run tests with coverage
        working-directory: backend/functions
        run: npm run test:coverage

      - name: Copy coverage report for SonarQube
        run: cp backend/functions/coverage/lcov.info backend-coverage.lcov

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend-coverage.lcov
          retention-days: 1

      - name: Upload CodeQL results
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:javascript-typescript
          upload: never
          output: ${{ github.workspace }}/codeql-results/backend
          post-processed-sarif-path: ${{ github.workspace }}/codeql-results/backend-final

      - name: Summarize backend CodeQL results
        if: >-
          always() &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          python3 .github/scripts/summarize_codeql_sarif.py \
            "${{ github.workspace }}/codeql-results/backend-final" \
            "Backend"

      - name: Upload backend CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-backend
          path: ${{ github.workspace }}/codeql-results/backend.sarif
          retention-days: 30

  web:
    name: Web quality
    needs: changes
    if: >-
      needs.changes.outputs.web_exists == 'true' &&
      (needs.changes.outputs.web == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --global --ignore-scripts firebase-tools@15.35.0
      - run: firebase emulators:exec --project demo-assodarts-rules --only firestore 'npm --prefix ../web run test:domain'
        working-directory: backend
      - run: npm run build
        working-directory: web
      - name: Use the App Hosting staging runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Build and check staging indexing policy
        working-directory: web
        env:
          ROOT_DOMAIN: staging.assodarts.app
        run: |
          npm run build
          grep -q 'name="robots" content="noindex, nofollow"' .next/server/app/index.html

  shared:
    name: Shared schemas quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: shared/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: shared
      - run: npm audit --audit-level=high
        working-directory: shared
      - run: npm test
        working-directory: shared

  rules:
    name: Firebase rules emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --ignore-scripts
        working-directory: backend/functions
      - run: npm run build
        working-directory: backend/functions
      - run: npm install --global --ignore-scripts firebase-tools@15.35.0
      - run: firebase emulators:exec --project demo-assodarts-rules --only firestore,storage 'npm --prefix functions run test:rules && cd functions && node scripts/test-public-emulator.cjs'
        working-directory: backend

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarqube:
    name: Analyze and enforce Quality Gate
    needs: [changes, ios, backend]
    # MODIFIÉ : accepte "skipped" pour ios (cas où seul le backend a changé),
    # en plus de "success". Un ios qui a réellement échoué reste bloquant.
    if: >-
      always() &&
      (needs.ios.result == 'success' || needs.ios.result == 'skipped') &&
      needs.backend.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download backend coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-coverage
          path: .

      - name: Scan with SonarQube
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # Le déploiement Firestore passe avant la distribution iOS : les règles,
  # indexes et functions du serveur sont toujours au moins aussi récents que
  # le binaire distribué.
  deploy-firestore-staging:
    name: Deploy Firestore rules, indexes and functions (staging)
    # Un secret détecté bloque dès ici : ce job déploie des Cloud Functions,
    # il ne doit pas partir sur un commit qui fuite une clé.
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && (inputs.deploy_staging || inputs.distribute_ios)) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-'))) &&
      (needs.ios.result == 'success' || needs.ios.result == 'skipped') &&
      needs.backend.result == 'success' &&
      needs.shared.result == 'success' &&
      needs.rules.result == 'success' &&
      (needs.web.result == 'success' || needs.web.result == 'skipped') &&
      needs.secret-scan.result == 'success' &&
      needs.sonarqube.result == 'success'
    needs: [changes, ios, backend, web, shared, rules, sonarqube, secret-scan]
    uses: ./.github/workflows/deploy-firebase.yml
    with:
      environment: staging
    secrets: inherit

  staging-distribute:
    name: Archive and distribute iOS staging build
    # Le déploiement Firestore doit avoir réussi avant toute distribution : une
    # app livrée sur des règles obsolètes est le bug qu'on cherche à éliminer.
    # `always()` est nécessaire pour que les résultats `skipped` ci-dessous
    # soient évalués au lieu de faire sauter le job d'office.
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.distribute_ios) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-') && needs.changes.outputs.ios == 'true')) &&
      needs.ios.result == 'success' &&
      needs.backend.result == 'success' &&
      needs.shared.result == 'success' &&
      needs.rules.result == 'success' &&
      (needs.web.result == 'success' || needs.web.result == 'skipped') &&
      needs.secret-scan.result == 'success' &&
      needs.sonarqube.result == 'success' &&
      needs.deploy-firestore-staging.result == 'success'
    needs: [changes, ios, backend, web, shared, rules, sonarqube, deploy-firestore-staging, secret-scan]
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Trigger Codemagic build
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            --request POST https://api.codemagic.io/builds \
            --header "Content-Type: application/json" \
            --header "x-auth-token: $CODEMAGIC_API_TOKEN" \
            --data "$(jq -nc --arg appId "$CODEMAGIC_APP_ID" --arg branch "$GITHUB_REF_NAME" --arg sha "$GITHUB_SHA" '{appId: $appId, workflowId: "ios-staging-distribute", branch: $branch, environment: {variables: {EXPECTED_GITHUB_SHA: $sha}}}')")
          build_id=$(jq -r '.buildId // empty' <<< "$response")
          test -n "$build_id" || { echo "Codemagic did not return buildId: $response"; exit 1; }
          echo "CODEMAGIC_BUILD_ID=$build_id" >> "$GITHUB_ENV"
          echo "CODEMAGIC_BUILD_URL=https://codemagic.io/app/$CODEMAGIC_APP_ID/build/$build_id" >> "$GITHUB_ENV"
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          CODEMAGIC_APP_ID: ${{ vars.CODEMAGIC_APP_ID }}

      - name: Wait for Codemagic build completion
        run: |
          deadline=$((SECONDS + 1740))
          while (( SECONDS < deadline )); do
            response=$(curl --fail-with-body --silent --show-error \
              --header "x-auth-token: $CODEMAGIC_API_TOKEN" \
              "https://api.codemagic.io/builds/$CODEMAGIC_BUILD_ID")
            status=$(jq -r '.status // empty' <<< "$response")
            echo "Codemagic build $CODEMAGIC_BUILD_ID status: ${status:-unknown}"
            case "$status" in
              finished)
                echo "CODEMAGIC_BUILD_STATUS=$status" >> "$GITHUB_ENV"
                exit 0
                ;;
              failed|canceled|timeout|skipped)
                echo "CODEMAGIC_BUILD_STATUS=$status" >> "$GITHUB_ENV"
                echo "Codemagic build ended with status $status: $CODEMAGIC_BUILD_URL"
                exit 1
                ;;
            esac
            sleep 20
          done
          echo "CODEMAGIC_BUILD_STATUS=timeout" >> "$GITHUB_ENV"
          echo "Timed out waiting for Codemagic build: $CODEMAGIC_BUILD_URL"
          exit 1
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}

      - name: Publish staging build summary
        if: always()
        run: |
          {
            echo "## Assodarts Staging"
            echo "- Status: ${CODEMAGIC_BUILD_STATUS:-not started}"
            if [ -n "${CODEMAGIC_BUILD_URL:-}" ]; then
              echo "- Codemagic build: $CODEMAGIC_BUILD_URL"
            fi
            if [ "${CODEMAGIC_BUILD_STATUS:-}" = "finished" ]; then
              echo "- Distributed via TestFlight, group beta-clubs-ext"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-web-staging:
    name: Deploy web to App Hosting (staging)
    needs: [changes, ios, backend, web, shared, rules, secret-scan, sonarqube]
    if: >-
      always() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-') &&
      (needs.ios.result == 'success' || needs.ios.result == 'skipped') &&
      needs.backend.result == 'success' && needs.shared.result == 'success' &&
      needs.rules.result == 'success' && needs.secret-scan.result == 'success' &&
      needs.sonarqube.result == 'success' && (needs.web.result == 'success' || needs.web.result == 'skipped')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      APPHOSTING_BACKEND_ID: ${{ vars.APPHOSTING_BACKEND_ID }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/assodarts-apphosting-key.json
    steps:
      - name: Validate staging settings
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test "$FIREBASE_PROJECT_ID" = 'assodarts-staging' || { echo 'Unexpected staging project'; exit 1; }
          test -n "$APPHOSTING_BACKEND_ID" || { echo 'Configure staging APPHOSTING_BACKEND_ID'; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo 'Configure staging Firebase credentials'; exit 1; }
          case "$APPHOSTING_BACKEND_ID" in *[!a-z0-9-]*|'') echo 'Invalid backend ID'; exit 1 ;; esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install Firebase CLI
        run: npm install --global --ignore-scripts firebase-tools@15.35.0
      - name: Authenticate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
      - name: Verify backend environment
        run: |
          firebase apphosting:backends:get "$APPHOSTING_BACKEND_ID" --project "$FIREBASE_PROJECT_ID" --json |
            jq -e '.result.environment == "staging"' > /dev/null || { echo 'Backend must explicitly use the staging environment'; exit 1; }
      - name: Roll out the tested commit
        run: firebase apphosting:rollouts:create "$APPHOSTING_BACKEND_ID" --project "$FIREBASE_PROJECT_ID" --git-commit "$GITHUB_SHA" --force --non-interactive
      - name: Remove credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
