name: Quality

"on":
  pull_request:
    branches:
      - main
      - "release-*"
  push:
    branches:
      - main
      - "release-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: iOS build, test, lint, and SAST
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          languages: swift
          build-mode: manual

      - name: Restore Swift package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: ${{ runner.os }}-xcode-${{ hashFiles('ios-assodarts/Assodarts.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Install SwiftLint
        run: arch -arm64 brew install swiftlint

      - name: Lint Swift source
        run: swiftlint lint --strict --config .swiftlint.yml

      - name: Resolve Swift package dependencies
        run: >-
          xcodebuild -resolvePackageDependencies
          -project ios-assodarts/Assodarts.xcodeproj
          -scheme Assodarts

      - name: Build and test
        run: >-
          xcodebuild test
          -project ios-assodarts/Assodarts.xcodeproj
          -scheme Assodarts
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          -enableCodeCoverage YES
          -resultBundlePath TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO

      - name: Export code coverage for SonarQube
        run: python3 .github/scripts/xccov_to_sonar_generic.py TestResults.xcresult ios-coverage.xml "$GITHUB_WORKSPACE"

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-coverage
          path: ios-coverage.xml
          retention-days: 1

      - name: Upload CodeQL results
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          category: /language:swift

  edge-functions:
    name: Edge Functions quality and SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Check formatting
        run: deno fmt --check backend/functions

      - name: Lint Edge Functions
        run: deno lint --config backend/deno.json backend/functions

      - name: Type-check Edge Functions
        run: deno check --config backend/deno.json backend/functions/**/index.ts

      - name: Run tests with coverage
        run: |
          if find backend/functions -name '*.test.ts' -o -name '*_test.ts' | grep -q .; then
            deno test --coverage=cov_profile --config backend/deno.json backend/functions
          else
            echo "No Deno test files found; skipping coverage collection."
          fi

      - name: Export coverage report
        run: |
          if [ -d cov_profile ]; then
            deno coverage cov_profile --lcov --output=edge-coverage.lcov
          else
            : > edge-coverage.lcov
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edge-coverage
          path: edge-coverage.lcov
          retention-days: 1

      - name: Upload CodeQL results
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          category: /language:javascript-typescript

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarqube:
    name: Analyze and enforce Quality Gate
    needs: [ios, edge-functions]
    if: >-
      always() &&
      vars.SONAR_HOST_URL != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download iOS coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-coverage
          path: .
        continue-on-error: true

      - name: Download Edge Functions coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: edge-coverage
          path: .
        continue-on-error: true

      - name: Scan with SonarQube
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300