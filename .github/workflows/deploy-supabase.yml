name: Deploy Supabase Edge Functions

"on":
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: supabase-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate deployment configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is not configured"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "SUPABASE_PROJECT_REF is not configured"; exit 1; }

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1

      - name: Prepare Supabase CLI directory
        run: |
          mkdir -p .supabase-ci/supabase/functions
          cp -R backend/functions/. .supabase-ci/supabase/functions/

      - name: Deploy authenticated functions
        working-directory: .supabase-ci
        run: |
          supabase functions deploy stripe-connect-onboard --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy stripe-connect-status --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy stripe-create-checkout --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy public redirect and webhook functions
        working-directory: .supabase-ci
        run: |
          supabase functions deploy stripe-return --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy stripe-webhook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt