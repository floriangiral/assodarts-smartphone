name: Deploy Firebase Backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: firebase-${{ inputs.environment }}
  cancel-in-progress: false

env:
  # Keep in sync with the pinned version tested against this project.
  FIREBASE_TOOLS_VERSION: "15.29.0"

jobs:
  deploy:
    name: Deploy Firestore rules and Cloud Functions
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate deployment configuration
        run: |
          test -n "$FIREBASE_PROJECT_ID" || { echo "FIREBASE_PROJECT_ID is not configured"; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "FIREBASE_SERVICE_ACCOUNT is not configured"; exit 1; }
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Write service account credentials
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Cloud Functions dependencies
        working-directory: backend/functions
        run: npm ci

      - name: Audit production dependencies
        working-directory: backend/functions
        run: npm audit --omit=dev --audit-level=high

      - name: Lint Cloud Functions
        working-directory: backend/functions
        run: npm run lint

      - name: Check formatting
        working-directory: backend/functions
        run: npm run format

      - name: Run unit tests
        working-directory: backend/functions
        run: npm test

      - name: Build Cloud Functions
        working-directory: backend/functions
        run: npm run build

      - name: Deploy Firestore rules and indexes
        working-directory: backend
        run: npx --yes firebase-tools@$FIREBASE_TOOLS_VERSION deploy --only firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Deploy Cloud Functions
        working-directory: backend
        run: npx --yes firebase-tools@$FIREBASE_TOOLS_VERSION deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Verify deployed functions are healthy
        working-directory: backend
        run: npx --yes firebase-tools@$FIREBASE_TOOLS_VERSION functions:list --project "$FIREBASE_PROJECT_ID"

      - name: Remove service account credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
