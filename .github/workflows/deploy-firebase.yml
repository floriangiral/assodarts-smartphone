# Deployments run either manually (Actions > Deploy Firebase Backend > Run workflow)
# or as the first stage of the staging pipeline, called by quality.yml.
# Pull requests validate rules locally without cloud credentials in quality.yml.
name: Deploy Firebase Backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub environment
        required: true
        type: choice
        options:
          - staging
          - production
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    # Volontairement aucun `secrets:` déclaré ici. FIREBASE_SERVICE_ACCOUNT est
    # un secret d'environnement : il est résolu par le `environment:` du job
    # `deploy`, pas transmis par l'appelant, qui n'y a pas accès.

permissions:
  contents: read

concurrency:
  group: firebase-${{ inputs.environment }}
  cancel-in-progress: false

env:
  # Keep in sync with the pinned version tested against this project.
  FIREBASE_TOOLS_VERSION: "15.35.0"

jobs:
  deploy:
    name: Deploy Firestore rules and Cloud Functions
    permissions:
      contents: read
      actions: read
      pull-requests: read
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && inputs.environment == 'staging' && startsWith(github.ref, 'refs/heads/release-'))
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      WEB_REVALIDATION_URL: ${{ vars.WEB_REVALIDATION_URL }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require successful quality checks for the selected commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$TARGET_ENVIRONMENT" = production ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Production requires the main branch"; exit 1
          fi
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=100")
          echo "$runs" | jq -e --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .conclusion == "success")] | length > 0' > /dev/null || {
            echo "No successful push Quality run for this exact commit"; exit 1
          }
          # A develop push may intentionally skip iOS when the same SHA has an
          # open PR. Require that PR's full Quality run before manual deployment.
          if [ "$GITHUB_REF" = refs/heads/develop ]; then
            prs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f "head=$GITHUB_REPOSITORY_OWNER:$GITHUB_REF_NAME" -f per_page=100)
            if echo "$prs" | jq -e --arg sha "$GITHUB_SHA" 'any(.[]; .head.sha == $sha and (.base.ref == "main" or .base.ref == "develop" or (.base.ref | startswith("release-"))))' > /dev/null; then
              pr_runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?head_sha=$GITHUB_SHA&event=pull_request&status=success&per_page=100")
              echo "$pr_runs" | jq -e --arg sha "$GITHUB_SHA" --argjson prs "$prs" '[.workflow_runs[] | select(.head_sha == $sha and .event == "pull_request" and .conclusion == "success") | .pull_requests[]?.number as $number | select(any($prs[]; .number == $number and .head.sha == $sha and (.base.ref == "main" or .base.ref == "develop" or (.base.ref | startswith("release-")))))] | length > 0' > /dev/null || {
                echo "No successful PR Quality run for this exact commit"; exit 1
              }
            fi
          fi

      - name: Validate deployment configuration
        run: |
          test -n "$FIREBASE_PROJECT_ID" || { echo "FIREBASE_PROJECT_ID is not configured"; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "FIREBASE_SERVICE_ACCOUNT is not configured"; exit 1; }
          if [ "$TARGET_ENVIRONMENT" = staging ]; then
            test "$WEB_REVALIDATION_URL" = 'https://assodarts-web-staging--assodarts-staging.europe-west4.hosted.app/api/revalidate' || {
              echo "Configure the staging WEB_REVALIDATION_URL GitHub variable"; exit 1;
            }
          fi
          PROJECT_ID=$(printf '%s' "$FIREBASE_PROJECT_ID" | tr -d '[:space:]')
          case "$PROJECT_ID" in
            *[!a-z0-9-]*|'') echo "FIREBASE_PROJECT_ID is invalid"; exit 1 ;;
            *) ;;
          esac
          echo "FIREBASE_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: backend/functions/.nvmrc
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Write service account credentials
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Cloud Functions dependencies
        working-directory: backend/functions
        run: npm ci --ignore-scripts

      - name: Install Firebase CLI
        run: npm install --global --ignore-scripts firebase-tools@$FIREBASE_TOOLS_VERSION

      - name: Audit production dependencies
        working-directory: backend/functions
        run: npm audit --omit=dev --audit-level=high

      - name: Lint Cloud Functions
        working-directory: backend/functions
        run: npm run lint

      - name: Check formatting
        working-directory: backend/functions
        run: npm run format

      - name: Run unit tests
        working-directory: backend/functions
        run: npm test

      - name: Build Cloud Functions
        working-directory: backend/functions
        run: npm run build

      - name: Configure web revalidation URL parameter
        if: env.WEB_REVALIDATION_URL != ''
        run: |
          printf 'WEB_REVALIDATION_URL=%s\n' "$WEB_REVALIDATION_URL" > "backend/functions/.env.$FIREBASE_PROJECT_ID"

      - name: Deploy Firestore rules and indexes
        working-directory: backend
        run: firebase deploy --only firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Deploy Cloud Functions
        working-directory: backend
        run: firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Verify deployed functions match source exports
        run: |
          firebase --json functions:list --project "$FIREBASE_PROJECT_ID" > deployed-functions.json
          node backend/scripts/verify-functions-deployment.js --functions-json deployed-functions.json

      - name: Verify deployed functions are healthy
        working-directory: backend
        run: firebase functions:list --project "$FIREBASE_PROJECT_ID"

      - name: Remove service account credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
